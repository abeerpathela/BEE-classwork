<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Pomodoro Clock</h1>

        <h2 id="mode">Work Time</h2>

        <div id="timer">
            25:00
        </div>

        <div class="buttons">

            <button id="startBtn">
                Start
            </button>

            <button id="pauseBtn">
                Pause
            </button>

            <button id="resetBtn">
                Reset
            </button>

        </div>

        <div class="stats">

            <p>
                Work Sessions :
                <span id="workCount">0</span>
            </p>

            <p>
                Break Sessions :
                <span id="breakCount">0</span>
            </p>

        </div>

    </div>

<script src="script.js"></script>

</body>
</html>
